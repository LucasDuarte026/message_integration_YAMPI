<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu pedido está a caminho!</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; margin: 30px auto; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); overflow: hidden;">
        <!-- Header -->
        <tr>
            <td style="background-color: #f59e0b; padding: 40px 20px; text-align: center;">
                <h1 style="color: #ffffff; margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.5px;">Seu pedido está a caminho! 🚚</h1>
                <p style="color: #fef3c7; margin: 10px 0 0 0; font-size: 16px;">O pacote do pedido #{order_id} já foi enviado.</p>
            </td>
        </tr>
        <!-- Greeting -->
        <tr>
            <td style="padding: 40px 30px 20px 30px;">
                <h2 style="color: #1e293b; margin: 0; font-size: 20px; font-weight: 600;">Olá, {name}!</h2>
                <p style="color: #64748b; margin: 15px 0 0 0; font-size: 16px; line-height: 1.6;">
                    Ótimas notícias! O seu pedido já está com a transportadora e a caminho da sua casa.
                </p>
                <div style="background-color: #f1f5f9; padding: 15px; border-radius: 8px; text-align: center; margin-top: 20px; border: 2px dashed #f59e0b;">
                    <span style="color: #64748b; font-size: 14px; display: block; margin-bottom: 5px;">Código de Rastreio:</span>
                    <strong style="color: #f59e0b; font-size: 24px; letter-spacing: 1px;">{tracking_code}</strong>
                </div>
            </td>
        </tr>
        <!-- Call to Action -->
        <tr>
            <td style="padding: 20px 30px 40px 30px; text-align: center;">
                <a href="{tracking_url}" target="_blank" style="background-color: #f59e0b; color: #ffffff; padding: 16px 32px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; display: inline-block; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.2), 0 2px 4px -1px rgba(245, 158, 11, 0.1);">
                    Acompanhar Entrega
                </a>
            </td>
        </tr>
    </table>
</body>
</html>
