templates_copy:
  pedido_aprovado:
    subject: "Eleveme: Pagamento confirmado para o pedido #{order_number}"
    title: "Seu pedido foi aprovado"
    body: "Temos uma ótima notícia: seu pedido foi aprovado. Agora é só aguardar que em breve ele seguirá para separação e envio. Você receberá as próximas atualizações por e-mail, incluindo o código de rastreio assim que o pedido for despachado."
    closing: "Prepare-se para viver uma nova experiência com a Eleveme: mais altura, mais conforto e mais confiança no seu dia a dia. Obrigado por escolher a Eleveme!"
  
  pedido_a_caminho:
    subject: "Eleveme: Atualização de envio do pedido #{order_number}"
    title: "Olá {customer_name}, seu pedido já está a caminho"
    body: "Temos uma ótima notícia: o seu pedido da Eleveme já foi enviado. Agora você pode acompanhar cada etapa da entrega pelo link de rastreio abaixo."
    cta_button: "Acompanhar pedido"
    disclaimer: "Sempre que a transportadora atualizar o status do pedido, a nova informação aparecerá diretamente nesse link. O prazo de entrega começa a contar a partir da postagem do pedido e pode variar conforme a sua região e a transportadora responsável."

  pedido_pendente:
    subject: "Eleveme: Informações para conclusão do pedido #{order_number}"
    title: "Seu pedido foi reservado"
    body: "Seu pedido já foi registrado em nosso sistema. Para garantir o envio rápido dos seus produtos, conclua o pagamento via PIX ou Cartão antes que a reserva expire."
    cta_button: "Concluir Pagamento Agora"
    disclaimer: "Os produtos ficam reservados temporariamente. Pagamentos via PIX possuem aprovação imediata."

  cupons_pedido:
    cupom_1:
      subject: "Eleveme: Condição especial disponível para o seu pedido #{order_number}"
      title: "Uma condição especial para o seu pedido"
      discount: 10
      coupon_code: "ELEVE10"
      body: "Sabemos que você escolheu produtos incríveis! Para dar aquele empurrãozinho final, liberamos um cupom exclusivo de 10% de desconto no seu pedido."
      cta_button: "Garantir 10% de Desconto"

    cupom_2:
      subject: "Eleveme: Atualização sobre os itens reservados no pedido #{order_number}"
      title: "Sua oportunidade de economizar 15% no pedido"
      discount: 15
      coupon_code: "ELEVE15"
      body: "Seu pedido ainda está aguardando você! Aumentamos o seu benefício para 15% de desconto exclusivo por tempo limitado."
      cta_button: "Garantir 15% de Desconto"

    cupom_3:
      subject: "Eleveme: Lembrete sobre a reserva do seu pedido #{order_number}"
      title: "Última condição reservada: 20% de desconto"
      discount: 20
      coupon_code: "ELEVE20"
      body: "Esta é a nossa oferta final para você adquirir seus produtos Eleveme com 20% de desconto."
      cta_button: "Garantir 20% de Desconto"

  cupons_carrinho:
    carrinho_cupom4:
      subject: "Olá {customer_name}, seus itens continuam salvos na Eleveme"
      title: "Você deixou itens salvos no seu carrinho"
      discount: 10
      coupon_code: "ELEVEME10"
      body: "Seus produtos ainda estão salvos no carrinho! Para você não perder seus itens, liberamos um cupom de 10% de desconto no valor total."
      cta_button: "Recuperar Carrinho com 10% OFF"

    carrinho_cupom5:
      subject: "Eleveme: Condição especial para os itens do seu carrinho"
      title: "Seu carrinho continua disponível com 15% de desconto"
      discount: 15
      coupon_code: "ELEVEME15"
      body: "Ainda dá tempo de garantir os produtos que você escolheu. Atualizamos o seu benefício para 15% de desconto para finalizar sua compra."
      cta_button: "Recuperar Carrinho com 15% OFF"

    carrinho_cupom6:
      subject: "Eleveme: Lembrete sobre os produtos selecionados no seu carrinho"
      title: "Último lembrete sobre o seu carrinho com 20% de desconto"
      discount: 20
      coupon_code: "ELEVEME20"
      body: "Este é o último lembrete antes que os itens do seu carrinho fiquem indisponíveis. Utilize o cupom de 20% de desconto antes do encerramento."
      cta_button: "Recuperar Carrinho com 20% OFF"

