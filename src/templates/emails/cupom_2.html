<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua última chance: 20% OFF!</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; margin: 30px auto; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); overflow: hidden;">
        <!-- Header -->
        <tr>
            <td style="background-color: #ef4444; padding: 40px 20px; text-align: center;">
                <h1 style="color: #ffffff; margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.5px;">ÚLTIMA CHANCE: 20% OFF!</h1>
                <p style="color: #fee2e2; margin: 10px 0 0 0; font-size: 16px;">Seu carrinho será expirado em breve.</p>
            </td>
        </tr>
        <!-- Greeting -->
        <tr>
            <td style="padding: 40px 30px 20px 30px;">
                <h2 style="color: #1e293b; margin: 0; font-size: 20px; font-weight: 600;">Olá, {name}!</h2>
                <p style="color: #64748b; margin: 15px 0 0 0; font-size: 16px; line-height: 1.6;">
                    Essa é a nossa melhor oferta e ela expira em algumas horas. Sabemos que você quer muito esses produtos, então estamos te dando <strong>20% de desconto</strong> para fechar negócio agora!
                </p>
                <div style="background-color: #f1f5f9; padding: 15px; border-radius: 8px; text-align: center; margin-top: 20px; border: 2px dashed #ef4444;">
                    <span style="color: #64748b; font-size: 14px; display: block; margin-bottom: 5px;">Use o cupom:</span>
                    <strong style="color: #ef4444; font-size: 24px; letter-spacing: 2px;">QUERO20</strong>
                </div>
            </td>
        </tr>
        <!-- Call to Action -->
        <tr>
            <td style="padding: 20px 30px 40px 30px; text-align: center;">
                <a href="{recovery_url}" target="_blank" style="background-color: #ef4444; color: #ffffff; padding: 16px 32px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; display: inline-block; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2), 0 2px 4px -1px rgba(239, 68, 68, 0.1);">
                    Aproveitar Meus 20% OFF
                </a>
            </td>
        </tr>
    </table>
</body>
</html>
