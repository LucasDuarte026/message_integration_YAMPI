# Compose Specification Standard - Message Integration (Produção)
name: message_integration_prod

services:
  # ============================================================================
  # 1. Serviço de Banco de Dados Relacional (PostgreSQL)
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: message_integration_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${DB_USER:?A variável DB_USER é obrigatória no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?A variável DB_PASSWORD é obrigatória no .env}
      POSTGRES_DB: ${DB_NAME:?A variável DB_NAME é obrigatória no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Persistência isolada no Docker Engine (Zero dependência de pastas do Windows)
      - pgdata:/var/lib/postgresql/data
      - ./containers/logs/postgres:/var/log/postgresql
    # Ajusta dono/permissão da pasta de logs (UID 70 no Alpine) e remove arquivos semanais > 28 dias (~4 arquivos / 30 dias)
    entrypoint:
      - /bin/sh
      - -c
      - "mkdir -p /var/log/postgresql && chown -R postgres:postgres /var/log/postgresql && chmod 755 /var/log/postgresql && find /var/log/postgresql -type f -name 'postgresql-*' -mtime +28 -delete && (while true; do sleep 86400; find /var/log/postgresql -type f -name 'postgresql-*' -mtime +28 -delete >/dev/null 2>&1; done) & exec docker-entrypoint.sh \"$$@\""
      - -- # Repassa os argumentos do bloco command como $@ para o docker-entrypoint.sh
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain # Pré-carrega módulos de estatísticas de queries e planos automáticos
      - -c
      - logging_collector=on # Redireciona logs para arquivos em disco (desativa saída contínua no stderr do Docker)
      - -c
      - log_destination=stderr,jsonlog # Gera simultaneamente log legível (.log) e JSON Lines estruturado (.json)
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=postgresql-week-%V # Um arquivo por semana ISO (rotacionado de 7 em 7 dias, retido por 4 semanas)
      - -c
      - log_truncate_on_rotation=on # Sobrescreve o arquivo correspondente ao rotacionar no mesmo nome
      - -c
      - log_rotation_age=7d # Rotaciona o arquivo de 7 em 7 dias
      - -c
      - log_rotation_size=50MB # Limite máximo semanal de segurança antes de rotacionar por tamanho
      - -c
      - log_file_mode=0644 # Permite leitura no host sem sudo (padrão do Postgres seria 0600)
      - -c
      - log_timezone=UTC # Alinhado ao padrão UTC-First do app.log
      - -c
      - log_min_duration_statement=200ms # Registra queries lentas (>= 200ms)
      - -c
      - log_min_duration_sample=50ms # Limiar mínimo para amostragem de queries medianas
      - -c
      - log_statement_sample_rate=0.10 # Amostra 10% das queries entre 50ms e 200ms para evitar sobrecarga de disco
      - -c
      - log_statement=ddl # Audita comandos de alteração de schema (CREATE, ALTER, DROP)
      - -c
      - log_lock_waits=on # Registra contenção de locks (ex.: SELECT ... FOR UPDATE aguardando outro worker)
      - -c
      - deadlock_timeout=1s # Tempo de espera de lock antes de logar e verificar deadlock
      - -c
      - log_temp_files=0 # Loga qualquer arquivo temporário em disco (sinaliza work_mem insuficiente)
      - -c
      - log_checkpoints=on # Registra checkpoints para correlacionar picos de escrita/I/O
      - -c
      - log_autovacuum_min_duration=500ms # Registra autovacuums lentos (>= 500ms)
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d " # Prefixo do .log: timestamp UTC, PID e usuário@banco
      - -c
      - auto_explain.log_min_duration=500ms # Anexa plano de execução (EXPLAIN) para queries >= 500ms
      - -c
      - auto_explain.log_analyze=off # Evita overhead de execução real (ANALYZE) em produção
      - -c
      - auto_explain.log_buffers=on # Inclui uso de buffers (RAM vs. disco) no plano
      - -c
      - auto_explain.log_wal=on # Inclui volume de WAL gerado no plano
      - -c
      - auto_explain.log_format=json # Formata o plano em JSON para parear com jsonlog
      - -c
      - auto_explain.log_nested_statements=on # Captura planos também dentro de funções/procedures
      - -c
      - pg_stat_statements.track=all # Contabiliza todas as queries (inclusive aninhadas)
      - -c
      - pg_stat_statements.track_utility=on # Inclui comandos utilitários (CREATE INDEX, VACUUM) nas estatísticas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # 2. Daemon Orquestrador de Mensagens & Recuperação de Vendas (Python)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: message_integration_app:${APP_VERSION:-latest}
    container_name: message_integration_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback seguro: se o servidor de webhook for ativado, fica restrito ao host local
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # Bind mounts diretos no filesystem Linux ext4 do WSL2 (idêntico ao ambiente de dev)
    volumes:
      - ./containers/logs:/app/local_data/logs
      - ./containers/emails:/app/local_data/emails
      - ./src/templates/emails/assets/images:/app/email_assets:ro
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 512M
        reservations:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# ==============================================================================
# Volumes Persistentes (Isolados no ambiente Docker / WSL2)
# ==============================================================================
volumes:
  pgdata:
    name: message_integration_pgdata

