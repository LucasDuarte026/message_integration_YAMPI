services:
  # Serviço do Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: message_integration_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?A variavel DB_USER nao esta definida no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?A variavel DB_PASSWORD nao esta definida no .env}
      POSTGRES_DB: ${DB_NAME:?A variavel DB_NAME nao esta definida no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Serviço da Aplicação
  app:
    build: .
    container_name: message_integration_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      # Sobrescreve a DATABASE_URL para apontar para o container 'db' em vez de 'localhost'
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    env_file:
      # Carrega as variáveis de credenciais do arquivo .env local (Yampi tokens, etc.)
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./containers/logs:/app/logs
      - ./containers/emails:/app/emails

volumes:
  pgdata:
