services:
  # Serviço do Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: message_integration_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?A variavel DB_USER nao esta definida no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?A variavel DB_PASSWORD nao esta definida no .env}
      POSTGRES_DB: ${DB_NAME:?A variavel DB_NAME nao esta definida no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.80' # Limite máximo de 0.80 vCPU (80% de 1 núcleo)
          memory: 512M # Limite máximo de 512 MB RAM (Sobram +450 MB de folga)
        reservations:
          cpus: '0.20' # Reserva mínima garantida de 0.20 vCPU
          memory: 128M # Reserva mínima garantida de 128 MB RAM

  # Serviço da Aplicação
  app:
    build: .
    image: message_integration_app:${APP_VERSION:-latest}
    container_name: message_integration_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./containers/logs:/app/local_data/logs
      - ./containers/emails:/app/local_data/emails
    deploy:
      resources:
        limits:
          cpus: '1.50' # Limite máximo de 1.50 vCPUs
          memory: 512M # Limite máximo de 512 MB RAM (Sobram +370 MB de folga)
        reservations:
          cpus: '0.50' # Reserva mínima garantida de 0.50 vCPU
          memory: 256M # Reserva mínima garantida de 256 MB RAM

volumes:
  pgdata:
